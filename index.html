<!DOCTYPE html>
<html>
<head>
    <title>网页围棋游戏</title>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
</head>
<body>
    <h1>网页围棋游戏</h1>
    <div id="game-container">
        <canvas id="go-board" width="450" height="450"></canvas>
    </div>

    <div>
        <label for="black-coords">黑棋坐标:</label>
        <input type="text" id="black-coords" readonly>
    </div>
    <div>
        <label for="white-coords">白棋坐标:</label>
        <input type="text" id="white-coords">
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
